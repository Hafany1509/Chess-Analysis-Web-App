<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Analysis - Lê Huy Hải</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="minimal-header">
        <h2>Chess Analysis System</h2>
        <p>B23DCCN272 - Lê Huy Hải</p>
    </header>

    <div class="main-layout">
        <div class="eval-bar-container">
            <div id="eval-score-v2">0.0</div>
            <div id="eval-bar" class="eval-bar"></div>
        </div>

        <div id="myBoard"></div>

        <div class="side-panel">
            <div id="player-info" class="player-card">
                <div class="player-line">⚪ <b id="white-name">?</b> <span id="white-elo"></span></div>
                <div class="player-line">⚫ <b id="black-name">?</b> <span id="black-elo"></span></div>
            </div>

            <div class="action-box">
                <textarea id="pgnInput" placeholder="Dán mã PGN tại đây..."></textarea>
                <div class="btn-group">
                    <button id="importPgnBtn" class="btn-primary">PHÂN TÍCH</button>
                    <button id="flipBoardBtn" class="btn-secondary">XOAY BÀN CỜ </button>
                </div>
            </div>

            <div class="history-container">
                <div id="eval-text" class="live-eval">Đánh giá: 0.0</div>
                <div id="history-list" class="move-grid"></div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
