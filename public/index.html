<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Analysis — Lê Huy Hải</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♟</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ── Header ────────────────────────────────────────── -->
    <header class="site-header">
        <div class="site-logo">
            <div class="logo-dot"></div>
            <h1>Chess Analysis</h1>
            <span class="site-byline">B23DCCN272 · Lê Huy Hải</span>
        </div>

        <div id="userSection">
            <button id="openLoginBtn">Đăng nhập</button>
            <span id="userInfo">
                <span id="displayUser"></span>
                <a href="#" id="logoutBtn">Đăng xuất</a>
            </span>
        </div>
    </header>

    <!-- ── Main ──────────────────────────────────────────── -->
    <div class="main-layout">

        <!-- Eval bar + Board gộp chung -->
        <div class="board-group">
            <div class="eval-bar-container">
                <div id="eval-score-v2">0.0</div>
                <div id="eval-bar" class="eval-bar"></div>
            </div>
            <div class="board-wrapper">
                <div id="myBoard"></div>
                <canvas id="primary_canvas" width="450" height="450"></canvas>
                <canvas id="drawing_canvas" width="450" height="450"></canvas>
            </div>
        </div>

        <!-- Side panel -->
        <div class="side-panel">

            <!-- Players -->
            <div class="player-card">
                <div class="player-row">
                    <div class="player-dot black"></div>
                    <span class="player-name" id="black-name">Black</span>
                    <span class="player-acc"    id="black-acc"></span>
                    <span class="player-result" id="black-result"></span>
                </div>
                <div class="player-divider"></div>
                <div class="player-row">
                    <div class="player-dot white"></div>
                    <span class="player-name" id="white-name">White</span>
                    <span class="player-acc"    id="white-acc"></span>
                    <span class="player-result" id="white-result"></span>
                </div>
            </div>

            <!-- Controls -->
            <div class="action-box">
                <textarea id="pgnInput" placeholder="Dán mã PGN tại đây..."></textarea>
                <div class="btn-group">
                    <button id="importPgnBtn" class="btn-primary">PHÂN TÍCH PGN</button>
                    <button id="toggleEngineBtn" class="btn-secondary">ENGINE: OFF</button>
                </div>
                <div class="btn-group">
                    <button id="flipBoardBtn" class="btn-secondary" style="flex:1;">↕ XOAY BÀN</button>
                    <button id="newGameBtn"   class="btn-new"       style="flex:1;">↺ VÁN MỚI</button>
                </div>
                <button id="analyzeBtn">⬡ PHÂN TÍCH BLUNDER</button>
                <div id="save-status"></div>
            </div>

            <!-- Move history -->
            <div class="history-container">
                <div id="eval-text" class="live-eval">Engine · 0.0</div>
                <div id="history-list" class="move-grid"></div>
            </div>

            <!-- My games -->
            <div class="my-games-box">
                <div class="my-games-header">Ván đấu của tôi</div>
                <div id="my-games-list">
                    <p style="padding:12px 14px; color:var(--text-muted); font-size:12px;">Đăng nhập để xem ván đấu.</p>
                </div>
            </div>

        </div>
    </div>

    <!-- ── Auth Modal ─────────────────────────────────────── -->
    <div id="authModal">
        <div class="modal-box">
            <div class="modal-title" id="authTitle">Đăng nhập</div>
            <input type="text"     id="username" class="modal-input" placeholder="Tên tài khoản" autocomplete="username">
            <input type="password" id="password" class="modal-input" placeholder="Mật khẩu" autocomplete="current-password">
            <div id="rememberRow" class="modal-remember">
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe">Nhớ tài khoản</label>
            </div>
            <button id="authBtn" class="modal-btn">XÁC NHẬN</button>
            <div class="modal-toggle">
                <a href="#" id="toggleAuth">Chưa có tài khoản? Đăng ký ngay</a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="chessboard-arrows.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="auth.js"></script>
    <script src="script.js"></script>
    <script src="analyzer.js"></script>
</body>
</html>
